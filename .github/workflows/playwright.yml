# Playwright CI for the SIS3 project.
# This file must live in the ROOT of the repository: <repo>/.github/workflows/playwright.yml
# The Playwright project itself lives in the SIS3/ subfolder, hence PROJECT_DIR.
name: Playwright Tests

on:
  push:            # every push to every branch (no branch filter)
  pull_request:    # every pull request
  workflow_dispatch:
    inputs:
      shards:
        description: 'Number of shards (1 = "before" measurement, 4 = "after")'
        type: choice
        options: ['4', '1']
        default: '4'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: SIS3

jobs:
  test:
    name: Tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    strategy:
      fail-fast: false   # one failed shard does not cancel the others
      matrix:
        # push / pull_request -> 4 shards; manual run can choose 1 shard for the baseline.
        shardIndex: ${{ fromJSON(inputs.shards == '1' && '[1]' || '[1, 2, 3, 4]') }}
        shardTotal: ${{ fromJSON(inputs.shards == '1' && '[1]' || '[4]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm                                    # caches ~/.npm
          cache-dependency-path: ${{ env.PROJECT_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          API_URL: ${{ vars.API_URL }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: ${{ env.PROJECT_DIR }}/blob-report
          retention-days: 1                             # intermediate file only

      - name: Upload traces and JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shardIndex }}
          path: |
            ${{ env.PROJECT_DIR }}/test-results/
            ${{ env.PROJECT_DIR }}/reports/
          retention-days: 14

  merge-reports:
    name: Merge reports
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.PROJECT_DIR }}/package-lock.json

      - run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: ${{ env.PROJECT_DIR }}/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML + JUnit
        run: npx playwright merge-reports --config merge.config.ts ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ${{ env.PROJECT_DIR }}/playwright-report
          retention-days: 14

      - name: Upload merged JUnit
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: ${{ env.PROJECT_DIR }}/reports/junit-merged.xml
          retention-days: 14
